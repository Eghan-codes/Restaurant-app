<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Smythe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bali Fooditary</title>
</head>
<body>
    <header>
        <div>
            <h1>Jimmy’s Diner</h1>
            <p>The best burgers and pizzas in town.</p>

        </div>
    </header>

    <div class="container" id="container">

    </div>
<!-- This displays the list of items been clicked or add  -->
    <div class="orders" id="orders">
        <h2>Your order</h2>
        <div id="order-list" class="order-list">
            
        </div>
        <p id="total" class="total">Total price:</p>
        <button id="order-btn" class="order-btn">Complete Order</button>
    </div>

    <div id="payment-modal" class="payment-modal">
        <h2>Enter card details</h2>
        <form action="#">
            <input type="text"
                    name="Username"
                    placeholder="Enter your name" >
            <input type="number"
                    name="User card number"
                    placeholder="Enter card number">
            <input type="number"
                    name="card cvv"
                    placeholder="Enter CVV">
        </form>
        <button id="pay-btn" class="pay-btn">Pay</button>
    </div>

	<script src="index.js" type="module"></script>
</body>
</html>
